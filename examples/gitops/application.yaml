# Reference Application for OpenShift GitOps / Argo CD.
# Copy into your GitOps repo and adapt namespace, project, and image tags.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: migration-toolkit-rhcl
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/maximilianoPizarro/migration-toolkit-rhcl
    targetRevision: main
    path: helm/migration-toolkit-rhcl
    helm:
      valueFiles:
        - values.yaml
      valuesObject:
        route:
          host: ""
        backend:
          image:
            tag: latest
        frontend:
          image:
            tag: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: migration-toolkit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

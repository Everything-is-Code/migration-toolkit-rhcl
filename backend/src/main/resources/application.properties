quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:migrationtool}
quarkus.datasource.password=${DB_PASSWORD:migrationtool}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:migrationtool}

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# Default localhost demo allowlist. Override with CORS_ORIGINS or QUARKUS_HTTP_CORS_ORIGINS for OCP/demo.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept-Language

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

quarkus.log.level=INFO
quarkus.log.category."com.redhat.migrationtoolkit".level=DEBUG

threescale.default.url=${THREESCALE_DEFAULT_URL:}
threescale.default.token=${THREESCALE_DEFAULT_TOKEN:}

# Kuadrant / Authorino location. Override KUADRANT_NAMESPACE / AUTHORINO_DEPLOYMENT for non-default installs.
kuadrant.namespace=${KUADRANT_NAMESPACE:kuadrant-system}
kuadrant.authorino.deployment=${AUTHORINO_DEPLOYMENT:authorino}

# Seconds for 3scale version detect HTTP client (connect + account request / dashboard request).
threescale.connect-timeout=${THREESCALE_CONNECT_TIMEOUT:5}
threescale.detect-timeout=${THREESCALE_DETECT_TIMEOUT:8}

# Page size for 3scale Admin API list endpoints (services, backends). Override for larger accounts.
threescale.page-size=${THREESCALE_PAGE_SIZE:500}

# Authorino operator ServiceAccount name. Override if a non-default install renamed it.
kuadrant.authorino.service-account=${AUTHORINO_SERVICE_ACCOUNT:authorino-authorino}

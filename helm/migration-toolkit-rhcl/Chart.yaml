apiVersion: v2
name: migration-toolkit-rhcl
description: 3scale to Red Hat Connectivity Link migration toolkit
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/nmushino/migration-toolkit-rhcl
sources:
  - https://github.com/nmushino/migration-toolkit-rhcl
  - https://github.com/maximilianoPizarro/migration-toolkit-rhcl
maintainers:
  - name: mushino
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/images: |
    - name: backend
      image: quay.io/maximilianopizarro/migration-toolkit-rhcl-backend:v0.1.0
      whitelisted: true
    - name: frontend
      image: quay.io/maximilianopizarro/migration-toolkit-rhcl-frontend:v0.1.0
      whitelisted: true
    - name: postgresql
      image: registry.redhat.io/rhel9/postgresql-15:latest
      whitelisted: true

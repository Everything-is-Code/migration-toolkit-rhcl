{{- if .Values.rbac.clusterAdmin }}
{{/*
WARNING: rbac.clusterAdmin binds the backend ServiceAccount to cluster-admin.
Prefer the scoped ClusterRole (default) which mirrors deploy/backend/06-rbac.yaml.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "migration-toolkit-rhcl.fullname" . }}-cluster-admin
  labels:
    {{- include "migration-toolkit-rhcl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ include "migration-toolkit-rhcl.backend" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{/*
Scoped applier role — keep apply apiGroups resources:["*"] and detection rules
aligned with deploy/backend/06-rbac.yaml. Full kind de-star is deferred with deploy rewrite.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "migration-toolkit-rhcl.fullname" . }}-applier
  labels:
    {{- include "migration-toolkit-rhcl.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
      - apps
      - networking.k8s.io
      - route.openshift.io
      - kuadrant.io
      - gateway.networking.k8s.io
      - telemetry.istio.io
      - networking.istio.io
      - devportal.kuadrant.io
    resources: ["*"]
    verbs: ["get", "list", "create", "update", "patch", "apply"]
  - apiGroups: ["config.openshift.io"]
    resources: ["ingresses"]
    verbs: ["get"]
  # Cluster version / capability detection (read-only; soft-fails on 403)
  - apiGroups: ["config.openshift.io"]
    resources: ["clusterversions"]
    verbs: ["get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["clusterserviceversions"]
    verbs: ["get", "list"]
  - apiGroups: ["maistra.io", "sailoperator.io"]
    resources: ["servicemeshcontrolplanes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "migration-toolkit-rhcl.fullname" . }}-applier
  labels:
    {{- include "migration-toolkit-rhcl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "migration-toolkit-rhcl.fullname" . }}-applier
subjects:
  - kind: ServiceAccount
    name: {{ include "migration-toolkit-rhcl.backend" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

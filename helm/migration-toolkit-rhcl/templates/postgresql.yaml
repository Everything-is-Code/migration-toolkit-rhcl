{{- if .Values.postgresql.enabled }}
{{- $_ := include "migration-toolkit-rhcl.requireDbCredentials" . -}}
{{- if .Values.postgresql.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "migration-toolkit-rhcl.postgresql" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "migration-toolkit-rhcl.postgresql" . }}
    app.kubernetes.io/component: database
    {{- include "migration-toolkit-rhcl.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size | quote }}
  {{- if .Values.postgresql.persistence.storageClassName }}
  storageClassName: {{ .Values.postgresql.persistence.storageClassName | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "migration-toolkit-rhcl.postgresql" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "migration-toolkit-rhcl.postgresql" . }}
    app.kubernetes.io/component: database
    app.kubernetes.io/name: {{ include "migration-toolkit-rhcl.postgresql" . }}
    app.openshift.io/runtime: postgresql
    {{- include "migration-toolkit-rhcl.labels" . | nindent 4 }}
  annotations:
    app.openshift.io/runtime: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "migration-toolkit-rhcl.postgresql" . }}
  template:
    metadata:
      labels:
        app: {{ include "migration-toolkit-rhcl.postgresql" . }}
        app.openshift.io/runtime: postgresql
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgresql
          image: {{ include "migration-toolkit-rhcl.postgresqlImage" . | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "migration-toolkit-rhcl.dbSecretName" . }}
                  key: DB_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "migration-toolkit-rhcl.dbSecretName" . }}
                  key: DB_PASSWORD
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "migration-toolkit-rhcl.dbSecretName" . }}
                  key: DB_NAME
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/pgsql/data
          {{- with .Values.postgresql.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: pgdata
          {{- if .Values.postgresql.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "migration-toolkit-rhcl.postgresql" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "migration-toolkit-rhcl.postgresql" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "migration-toolkit-rhcl.postgresql" . }}
    {{- include "migration-toolkit-rhcl.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: {{ include "migration-toolkit-rhcl.postgresql" . }}
{{- end }}

{{- /* Always evaluate credential gate so template fails without password/existingSecret. */ -}}
{{- $_ := include "migration-toolkit-rhcl.requireDbCredentials" . -}}
{{- $emitDbKeys := not .Values.postgresql.existingSecret -}}
{{- $emitToken := .Values.backend.threescale.defaultToken -}}
{{- if or $emitDbKeys $emitToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "migration-toolkit-rhcl.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "migration-toolkit-rhcl.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $emitDbKeys }}
  DB_USER: {{ .Values.postgresql.username | quote }}
  DB_PASSWORD: {{ .Values.postgresql.password | quote }}
  DB_NAME: {{ .Values.postgresql.database | quote }}
  {{- end }}
  {{- if $emitToken }}
  THREESCALE_DEFAULT_TOKEN: {{ .Values.backend.threescale.defaultToken | quote }}
  {{- end }}
{{- end }}

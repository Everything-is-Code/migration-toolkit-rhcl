nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

backend:
  image:
    repository: quay.io/maximilianopizarro/migration-toolkit-rhcl-backend
    tag: v0.1.0
    pullPolicy: Always
  replicas: 1
  threescale:
    defaultUrl: ""
    defaultToken: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

frontend:
  image:
    repository: quay.io/maximilianopizarro/migration-toolkit-rhcl-frontend
    tag: v0.1.0
    pullPolicy: Always
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

postgresql:
  enabled: true
  # Used when postgresql.enabled is false (external database JDBC URL host pieces)
  host: ""
  port: "5432"
  database: migrationtool
  username: migrationtool
  password: migrationtool
  image:
    repository: registry.redhat.io/rhel9/postgresql-15
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

route:
  enabled: true
  host: ""
  tls:
    termination: edge

rbac:
  # When true, bind the backend ServiceAccount to cluster-admin (not recommended).
  # When false, create the scoped ClusterRole matching deploy/backend/06-rbac.yaml.
  clusterAdmin: false

# RHCL migration toolkit — 3scale lab seed catalog
# One product + one focused policy (or auth / multi-backend pattern) per conversion case.
# Consumed by: threescale-seed --fixtures <this-file>
# Tool: https://github.com/Everything-is-Code/3scaleextract (threescale-seed)
#
# Do not seed until an operator runs ./scripts/seed-rhcl-cases.sh against a lab tenant.

account:
  org_name: RHCL Migration Seed Org
  username: rhcl_seed_user
  email: rhcl-seed@example.com
  password: RhclSeedPass123!

backends:
  - system_name: rhcl_seed_upstream
    name: RHCL Seed Upstream
    private_endpoint: "https://httpbin.org:443"
    description: Shared dummy upstream for single-backend RHCL conversion cases

  - system_name: rhcl_seed_orders
    name: RHCL Seed Orders Upstream
    private_endpoint: "https://orders.example.com:443"
    description: Multi-backend demo upstream (orders)

  - system_name: rhcl_seed_catalog_be
    name: RHCL Seed Catalog Upstream
    private_endpoint: "https://catalog.example.com:443"
    description: Multi-backend demo upstream (catalog)

products:
  # ── CORS → ResponseHeaderModifier / native type:CORS (capability-gated) ──
  - system_name: rhcl_seed_cors
    name: RHCL Seed CORS
    description: Single policy cors for Gateway API CORS conversion
    auth_mode: api_key
    backend_refs: [rhcl_seed_upstream]
    policy_names: [cors]
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-cors-app
        plan: basic
    coverage:
      - "policy: cors"
      - "conversion: ResponseHeaderModifier or type:CORS"

  # ── headers / header_modification → HTTPRoute HeaderModifier ──
  - system_name: rhcl_seed_headers
    name: RHCL Seed Headers
    description: Single policy headers (request/response header modification)
    auth_mode: api_key
    backend_refs: [rhcl_seed_upstream]
    policy_names: [headers]
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-headers-app
        plan: basic
    coverage:
      - "policy: headers"
      - "conversion: RequestHeaderModifier / ResponseHeaderModifier"

  - system_name: rhcl_seed_header_modification
    name: RHCL Seed Header Modification Alias
    description: Alias header_modification (same converter as headers)
    auth_mode: api_key
    backend_refs: [rhcl_seed_upstream]
    policy_names: [header_modification]
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-header-mod-app
        plan: basic
    coverage:
      - "policy: header_modification"
      - "conversion: same as headers"

  # ── ip_check → AuthorizationPolicy / AuthPolicy OPA ──
  - system_name: rhcl_seed_ip_check
    name: RHCL Seed IP Check
    description: Single policy ip_check for dual-mode IP allowlist conversion
    auth_mode: api_key
    backend_refs: [rhcl_seed_upstream]
    policy_names: [ip_check]
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-ip-check-app
        plan: basic
    coverage:
      - "policy: ip_check"
      - "conversion: AuthorizationPolicy or AuthPolicy OPA"

  # ── edge_limiting → RateLimitPolicy ──
  - system_name: rhcl_seed_edge_limiting
    name: RHCL Seed Edge Limiting
    description: Single policy edge_limiting for RateLimitPolicy conversion
    auth_mode: api_key
    backend_refs: [rhcl_seed_upstream]
    policy_names: [edge_limiting]
    plans:
      - system_name: basic
        name: Basic
        limit_value: 500
    applications:
      - name: rhcl-edge-limiting-app
        plan: basic
    coverage:
      - "policy: edge_limiting"
      - "conversion: RateLimitPolicy"

  # ── token_introspection → AuthPolicy oauth2Introspection ──
  - system_name: rhcl_seed_token_introspection
    name: RHCL Seed Token Introspection
    description: Single policy token_introspection for oauth2Introspection AuthPolicy
    auth_mode: api_key
    backend_refs: [rhcl_seed_upstream]
    policy_names: [token_introspection]
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-token-intro-app
        plan: basic
    coverage:
      - "policy: token_introspection"
      - "conversion: AuthPolicy oauth2Introspection"

  # ── App ID auth + real application secrets (no extra policy) ──
  - system_name: rhcl_seed_app_id
    name: RHCL Seed App ID Auth
    description: App ID + App Key auth with applications for Secret generation
    auth_mode: app_id
    backend_refs: [rhcl_seed_upstream]
    policy_names: []
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-app-id-01
        plan: basic
      - name: rhcl-app-id-02
        plan: basic
    coverage:
      - "auth: app_id"
      - "conversion: Application Secrets from Admin API"

  # ── logging → Telemetry / EnvoyFilter logging ──
  - system_name: rhcl_seed_logging
    name: RHCL Seed Logging
    description: Single policy logging with json_object_config for Telemetry + EnvoyFilter
    auth_mode: api_key
    backend_refs: [rhcl_seed_upstream]
    policy_names: [logging]
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-logging-app
        plan: basic
    coverage:
      - "policy: logging"
      - "conversion: telemetry.yaml + envoyfilter-logging.yaml"

  # ── default_credentials (Anonymous Access) → AuthPolicy anonymous ──
  - system_name: rhcl_seed_anonymous
    name: RHCL Seed Anonymous Access
    description: Single policy default_credentials for Anonymous Access AuthPolicy
    auth_mode: api_key
    backend_refs: [rhcl_seed_upstream]
    policy_names: [default_credentials]
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-anonymous-app
        plan: basic
    coverage:
      - "policy: default_credentials"
      - "conversion: AuthPolicy anonymous + anonymous credentials Secret"

  # ── url_rewriting → EnvoyFilter Lua ──
  - system_name: rhcl_seed_url_rewriting
    name: RHCL Seed URL Rewriting
    description: Single policy url_rewriting (commands) for EnvoyFilter Lua path rewrite
    auth_mode: api_key
    backend_refs: [rhcl_seed_upstream]
    policy_names: [url_rewriting]
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-url-rewriting-app
        plan: basic
    coverage:
      - "policy: url_rewriting"
      - "conversion: envoyfilter-url-rewriting.yaml"

  # ── caching (3scale Auth Caching) → AuthPolicy cache block ──
  # APIcast system name is "caching"; RHCL also accepts alias "3scale_auth_caching".
  - system_name: rhcl_seed_auth_caching
    name: RHCL Seed Auth Caching
    description: Single policy caching (3scale Auth Caching) with OIDC JWT for cache block
    auth_mode: oidc
    backend_refs: [rhcl_seed_upstream]
    policy_names: [caching]
    oidc:
      realm_url: "https://sso.example.com/auth/realms/rhcl-seed"
      zync_client_id: zync-admin
      zync_client_secret: ZyncSecret123-for-rhsso
      redirect_url: "https://rhcl-seed-auth-caching.example.com/callback"
      standard_flow: true
      service_accounts: true
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-auth-caching-app
        plan: basic
        redirect_url: "https://rhcl-seed-auth-caching.example.com/callback"
    coverage:
      - "policy: caching (3scale Auth Caching)"
      - "auth: oidc"
      - "conversion: AuthPolicy JWT + cache block"

  # ── jwt_claim_check → AuthPolicy patternMatching ──
  - system_name: rhcl_seed_jwt_claim_check
    name: RHCL Seed JWT Claim Check
    description: OIDC + jwt_claim_check for AuthPolicy claim patternMatching
    auth_mode: oidc
    backend_refs: [rhcl_seed_upstream]
    policy_names: [jwt_claim_check]
    oidc:
      realm_url: "https://sso.example.com/auth/realms/rhcl-seed"
      zync_client_id: zync-admin
      zync_client_secret: ZyncSecret123-for-rhsso
      redirect_url: "https://rhcl-seed-jwt-claim.example.com/callback"
      standard_flow: true
      service_accounts: true
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-jwt-claim-app
        plan: basic
        redirect_url: "https://rhcl-seed-jwt-claim.example.com/callback"
    coverage:
      - "policy: jwt_claim_check"
      - "auth: oidc"
      - "conversion: AuthPolicy JWT + claim patternMatching"

  # ── upstream_connection → HTTPRoute timeouts ──
  - system_name: rhcl_seed_upstream_connection
    name: RHCL Seed Upstream Connection
    description: Single policy upstream_connection for HTTPRoute timeouts / annotations
    auth_mode: api_key
    backend_refs: [rhcl_seed_upstream]
    policy_names: [upstream_connection]
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-upstream-conn-app
        plan: basic
    coverage:
      - "policy: upstream_connection"
      - "conversion: HTTPRoute timeouts (capability-gated)"

  # ── payload_limits (Response/Request Content Limits) → EnvoyFilter buffer ──
  # APIcast system name is "payload_limits"; RHCL also accepts alias "content_limits".
  - system_name: rhcl_seed_content_limits
    name: RHCL Seed Content Limits
    description: Single policy payload_limits for request body EnvoyFilter + response annotation
    auth_mode: api_key
    backend_refs: [rhcl_seed_upstream]
    policy_names: [payload_limits]
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-content-limits-app
        plan: basic
    coverage:
      - "policy: payload_limits (content_limits)"
      - "conversion: envoyfilter-content-limits.yaml"

  # ── retry → HTTPRoute retry or EnvoyFilter fallback ──
  - system_name: rhcl_seed_retry
    name: RHCL Seed Retry
    description: Single policy retry for HTTPRoute retry.attempts or EnvoyFilter fallback
    auth_mode: api_key
    backend_refs: [rhcl_seed_upstream]
    policy_names: [retry]
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-retry-app
        plan: basic
    coverage:
      - "policy: retry"
      - "conversion: HTTPRoute retry or envoyfilter-retry.yaml"

  # ── keycloak_role_check → AuthPolicy role patternMatching ──
  - system_name: rhcl_seed_keycloak_roles
    name: RHCL Seed Keycloak Role Check
    description: OIDC + keycloak_role_check for AuthPolicy realm/client role patterns
    auth_mode: oidc
    backend_refs: [rhcl_seed_upstream]
    policy_names: [keycloak_role_check]
    oidc:
      realm_url: "https://sso.example.com/auth/realms/rhcl-seed"
      zync_client_id: zync-admin
      zync_client_secret: ZyncSecret123-for-rhsso
      redirect_url: "https://rhcl-seed-keycloak.example.com/callback"
      standard_flow: true
      service_accounts: true
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-keycloak-roles-app
        plan: basic
        redirect_url: "https://rhcl-seed-keycloak.example.com/callback"
    coverage:
      - "policy: keycloak_role_check"
      - "auth: oidc"
      - "conversion: AuthPolicy keycloak-role-check patternMatching"

  # ── OIDC / JWT baseline (no extra policy) ──
  - system_name: rhcl_seed_oidc_jwt
    name: RHCL Seed OIDC JWT Auth
    description: OIDC auth only — AuthPolicy JWT issuerUrl without extra policies
    auth_mode: oidc
    backend_refs: [rhcl_seed_upstream]
    policy_names: []
    oidc:
      realm_url: "https://sso.example.com/auth/realms/rhcl-seed"
      zync_client_id: zync-admin
      zync_client_secret: ZyncSecret123-for-rhsso
      redirect_url: "https://rhcl-seed-oidc.example.com/callback"
      standard_flow: true
      service_accounts: true
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-oidc-jwt-app
        plan: basic
        redirect_url: "https://rhcl-seed-oidc.example.com/callback"
    coverage:
      - "auth: oidc"
      - "conversion: AuthPolicy JWT"

  # ── multi-policy chains (intentional; E2E + parity matrix) ──

  - system_name: rhcl_seed_claim_role_chain
    name: RHCL Seed Claim Role Chain
    description: OIDC + jwt_claim_check + keycloak_role_check policy chain
    auth_mode: oidc
    backend_refs: [rhcl_seed_upstream]
    policy_names: [jwt_claim_check, keycloak_role_check]
    oidc:
      realm_url: "https://sso.example.com/auth/realms/rhcl-seed"
      zync_client_id: zync-admin
      zync_client_secret: ZyncSecret123-for-rhsso
      redirect_url: "https://rhcl-seed-claim-role-chain.example.com/callback"
      standard_flow: true
      service_accounts: true
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-claim-role-chain-app
        plan: basic
        redirect_url: "https://rhcl-seed-claim-role-chain.example.com/callback"
    coverage:
      - "policy chain: jwt_claim_check + keycloak_role_check"
      - "conversion: AuthPolicy JWT claim + keycloak role patterns"
      - "e2e: frontend/e2e/yaml-expectations.ts rhcl_seed_claim_role_chain"

  - system_name: rhcl_seed_claim_cache_chain
    name: RHCL Seed Claim Cache Chain
    description: OIDC + jwt_claim_check + caching (3scale Auth Caching) chain
    auth_mode: oidc
    backend_refs: [rhcl_seed_upstream]
    policy_names: [jwt_claim_check, caching]
    oidc:
      realm_url: "https://sso.example.com/auth/realms/rhcl-seed"
      zync_client_id: zync-admin
      zync_client_secret: ZyncSecret123-for-rhsso
      redirect_url: "https://rhcl-seed-claim-cache-chain.example.com/callback"
      standard_flow: true
      service_accounts: true
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-claim-cache-chain-app
        plan: basic
        redirect_url: "https://rhcl-seed-claim-cache-chain.example.com/callback"
    coverage:
      - "policy chain: jwt_claim_check + caching"
      - "conversion: AuthPolicy JWT claim + cache block"
      - "e2e: frontend/e2e/yaml-expectations.ts rhcl_seed_claim_cache_chain"

  - system_name: rhcl_seed_auth_chain
    name: RHCL Seed Auth Chain
    description: OIDC + jwt_claim_check + ip_check (AuthPolicy + AuthorizationPolicy)
    auth_mode: oidc
    backend_refs: [rhcl_seed_upstream]
    policy_names: [jwt_claim_check, ip_check]
    oidc:
      realm_url: "https://sso.example.com/auth/realms/rhcl-seed"
      zync_client_id: zync-admin
      zync_client_secret: ZyncSecret123-for-rhsso
      redirect_url: "https://rhcl-seed-auth-chain.example.com/callback"
      standard_flow: true
      service_accounts: true
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-auth-chain-app
        plan: basic
        redirect_url: "https://rhcl-seed-auth-chain.example.com/callback"
    coverage:
      - "policy chain: jwt_claim_check + ip_check"
      - "conversion: AuthPolicy claim patterns + AuthorizationPolicy IP allowlist"
      - "e2e: frontend/e2e/yaml-expectations.ts rhcl_seed_auth_chain"

  # ── multi-backend path-first routing ──
  # Seeder assigns paths / , /backend-2 , /backend-3 by backend_refs order.
  - system_name: rhcl_seed_multi_backend
    name: RHCL Seed Multi Backend
    description: Three backends for path-first multi-backend HTTPRoute conversion
    auth_mode: api_key
    backend_refs: [rhcl_seed_upstream, rhcl_seed_orders, rhcl_seed_catalog_be]
    policy_names: []
    plans:
      - system_name: basic
        name: Basic
        limit_value: 1000
    applications:
      - name: rhcl-multi-backend-app
        plan: basic
    coverage:
      - "backends: 3 (path-first)"
      - "conversion: multi-doc ServiceEntry/DestinationRule + path backendRefs"

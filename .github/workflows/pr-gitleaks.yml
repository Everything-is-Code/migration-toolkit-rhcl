name: PR secret scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        # gitleaks-action@v2 requires a paid license for org repos; use OSS CLI via Docker.
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.2 \
            detect \
            --source /repo \
            --config /repo/.gitleaks.toml \
            --redact \
            --verbose

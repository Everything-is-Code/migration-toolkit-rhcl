name: PR traceability check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  traceability:
    name: PR ↔ issue traceability
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # Always run the checker from the PR base branch (main), not the feature
      # branch — epic/stacked PRs should not need to ship script updates.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-ref
      - name: Require Closes/Fixes #N in PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash base-ref/scripts/ci/check_pr_traceability.sh

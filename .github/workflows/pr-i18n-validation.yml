name: PR i18n validation

on:
  pull_request:
    paths:
      - "frontend/src/locales/**"
      - "frontend/src/utils/apiError.ts"
      - ".github/workflows/pr-i18n-validation.yml"

permissions:
  contents: read

jobs:
  validate-i18n:
    name: Validate en/ja locale parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Locale smoke tests
        run: npm test -- --run src/locales/locales.smoke.test.ts

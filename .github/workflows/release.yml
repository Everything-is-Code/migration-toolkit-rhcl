name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  QUAY_REGISTRY: quay.io
  QUAY_NAMESPACE: maximilianopizarro

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: migration-toolkit-rhcl-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile.jvm
          - image: migration-toolkit-rhcl-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        run: |
          source scripts/lib/version.sh
          if [ "${{ github.event_name }}" = "push" ]; then
            REF_TAG="${GITHUB_REF_NAME}"
            TAG_VER="${REF_TAG#v}"
            if [ "$TAG_VER" != "$VERSION" ]; then
              echo "Git tag ${REF_TAG} does not match Chart.yaml version ${VERSION}"
              exit 1
            fi
            echo "RELEASE_TAG=${REF_TAG}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${VERSION_V}" >> "$GITHUB_ENV"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.QUAY_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Login to registry.access.redhat.com
        uses: docker/login-action@v3
        with:
          registry: registry.access.redhat.com
          username: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          password: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}

      - name: Login to registry.redhat.io
        uses: docker/login-action@v3
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          password: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: |
            ${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ matrix.image }}:${{ env.RELEASE_TAG }}
            ${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ matrix.image }}:latest

  publish-release:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        run: |
          source scripts/lib/version.sh
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${VERSION_V}" >> "$GITHUB_ENV"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Package Helm chart
        run: |
          mkdir -p docs
          helm package helm/migration-toolkit-rhcl --destination docs/

      - name: Update Helm repo index
        run: |
          source scripts/lib/helm-repo-url.sh
          if [ ! -f docs/index.yaml ]; then
            printf 'apiVersion: v1\nentries: {}\ngenerated: "%s"\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/index.yaml
          fi
          helm repo index docs/ --url "${HELM_REPO_URL}" --merge docs/index.yaml

      - name: Publish Helm chart via pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No Helm chart changes to publish."
            exit 0
          fi
          BRANCH="chore/helm-chart-${{ env.RELEASE_TAG }}"
          git checkout -b "${BRANCH}"
          git commit -m "chore: publish Helm chart ${{ env.RELEASE_TAG }}"
          git push origin "${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore: publish Helm chart ${{ env.RELEASE_TAG }}" \
            --body "Automated Helm repository update for release ${{ env.RELEASE_TAG }}."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Release ${{ env.RELEASE_TAG }}"
          gh release view "${{ env.RELEASE_TAG }}" 2>/dev/null \
            && gh release edit "${{ env.RELEASE_TAG }}" --notes "${NOTES}" \
            || gh release create "${{ env.RELEASE_TAG }}" --title "${{ env.RELEASE_TAG }}" --notes "${NOTES}"

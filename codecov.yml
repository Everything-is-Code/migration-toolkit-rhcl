# Codecov regression gates for backend JaCoCo (flag: backend).
# Compares each PR to its base commit — coverage must not decrease (threshold 0%).
# Baseline ratchets automatically when main improves; no pom.xml edits needed.
# Setup: add CODECOV_TOKEN repo secret; mark codecov/project/backend and
# codecov/patch/backend as required checks after the first upload on main.
coverage:
  status:
    project:
      default: false
      backend:
        target: auto
        threshold: 0%
        informational: false
        if_ci_failed: error
        if_no_uploads: error
        flags:
          - backend
    patch:
      default: false
      backend:
        target: auto
        threshold: 0%
        informational: false
        if_ci_failed: error
        if_no_uploads: error
        flags:
          - backend

comment:
  layout: "condensed_header, diff, flags"
  require_changes: true

flags:
  backend:
    paths:
      - backend/src/main/java/**
    carryforward: true

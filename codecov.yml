# Codecov regression gates for backend JaCoCo (flag: backend) and frontend Vitest (flag: frontend).
# Compares each PR to its base commit — coverage must not decrease (threshold 0%).
# Baseline ratchets automatically when main improves; no pom.xml edits needed.
# Setup: add CODECOV_TOKEN repo secret; mark codecov/project/* and codecov/patch/*
# as required checks after the first upload on main for each flag.
coverage:
  status:
    project:
      default: false
      backend:
        target: auto
        threshold: 0%
        informational: false
        if_ci_failed: error
        if_no_uploads: error
        flags:
          - backend
      frontend:
        target: auto
        threshold: 0%
        informational: false
        if_ci_failed: error
        if_no_uploads: error
        flags:
          - frontend
    patch:
      default: false
      backend:
        target: auto
        threshold: 0%
        informational: false
        if_ci_failed: error
        if_no_uploads: error
        flags:
          - backend
      frontend:
        target: auto
        threshold: 0%
        informational: false
        if_ci_failed: error
        if_no_uploads: error
        flags:
          - frontend

comment:
  layout: "condensed_header, diff, flags"
  require_changes: true

flags:
  backend:
    paths:
      - backend/src/main/java/**
    carryforward: true
  frontend:
    paths:
      - frontend/src/**
    carryforward: true

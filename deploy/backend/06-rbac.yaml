---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migration-tool-backend
  namespace: NAMESPACE_PLACEHOLDER
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: migration-tool-applier
rules:
  - apiGroups: ["", "apps", "networking.k8s.io", "route.openshift.io",
                "kuadrant.io", "gateway.networking.k8s.io",
                "telemetry.istio.io", "networking.istio.io",
                "devportal.kuadrant.io"]
    resources: ["*"]
    verbs: ["get", "list", "create", "update", "patch", "apply"]
  - apiGroups: ["config.openshift.io"]
    resources: ["ingresses"]
    verbs: ["get"]
  # Cluster version / capability detection (read-only; soft-fails on 403)
  - apiGroups: ["config.openshift.io"]
    resources: ["clusterversions"]
    verbs: ["get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["clusterserviceversions"]
    verbs: ["get", "list"]
  - apiGroups: ["maistra.io", "sailoperator.io"]
    resources: ["servicemeshcontrolplanes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: migration-tool-applier-binding
subjects:
  - kind: ServiceAccount
    name: migration-tool-backend
    namespace: NAMESPACE_PLACEHOLDER
roleRef:
  kind: ClusterRole
  name: migration-tool-applier
  apiGroup: rbac.authorization.k8s.io
